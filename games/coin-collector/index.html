<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Collector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <div>
                <h1>🪙 Coin Collector</h1>
                <p>¡Recoge todas las monedas antes de que se acabe el tiempo!</p>
            </div>

            <div class="stats">
                <div class="stat">
                    <span>🏆 Puntos</span>
                    <strong id="score">0</strong>
                </div>

                <div class="stat">
                    <span>⏱️ Tiempo</span>
                    <strong id="time">30</strong>
                </div>
            </div>
        </header>

        <section id="game">

            <div class="decor decor-1"></div>
            <div class="decor decor-2"></div>
            <div class="decor decor-3"></div>

            <div id="player">
                🧍
            </div>

            <div class="coin" id="coin1">🪙</div>
            <div class="coin" id="coin2">🪙</div>
            <div class="coin" id="coin3">🪙</div>
            <div class="coin" id="coin4">🪙</div>
            <div class="coin" id="coin5">🪙</div>

            <div id="message" class="hidden">
                <h2 id="message-title"></h2>
                <p id="message-text"></p>
                <button id="message-button">Jugar otra vez</button>
            </div>

        </section>

        <div class="instructions">
            <span>🎮</span>
            Usa <strong>W A S D</strong> para moverte
        </div>

        <button id="restart">🔄 Reiniciar partida</button>

    </main>

    <script src="script.js"></script>

</body>
</html>
